version: 2
updates:
  # Gradle/Kotlin dependencies and plugins (app/build.gradle.kts, build.gradle.kts).
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    # Each floor below requires compileSdk 37 (this project deliberately stays on 36 — see
    # compileSdk's own comment in gradle/libs.versions.toml) and was already proposed, checked
    # against the real AAR metadata, and rejected: PR #13 (navigation-compose), #9 (compose-bom),
    # #10 (core-ktx). Ignored here so Dependabot doesn't keep reopening the same rejected bump
    # every week; revisit once this project actually moves to compileSdk 37/AGP 9.1+.
    ignore:
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">= 2.10.0"]
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2026.08.00"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.19.0"]

  # Base image for the CI build container (Dockerfile).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # Actions referenced from .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
