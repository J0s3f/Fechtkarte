name: "Release"

# Adapted from https://github.com/AlpineMapsOrg/renderer/blob/main/.github/workflows/play-store.yml
# -- same tag-triggered shape (check tag / build / deploy), but building via this project's own
# Dockerfile instead of a bespoke CMake/Qt recipe: a successful image build already runs the
# full clean test suite (the same commit gate `scripts/build.sh` uses locally), so this workflow
# never has to duplicate a second, potentially-diverging description of how to build the app.
#
# Two independent deliverables from one signed build: `deploy` uploads the AAB to Google Play,
# `github-release` publishes the APK as a GitHub Release. `github-release` depends only on
# `build-aab`, not on `deploy` -- Play Console verification being pending (see T9.16) must not
# block GitHub releases; the two destinations have nothing to do with each other once the
# signed artifacts exist.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: play-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_release_tag:
    if: github.repository == 'J0s3f/Fechtkarte'
    runs-on: ubuntu-24.04
    outputs:
      tagged: ${{ steps.release_tag.outputs.tagged }}
      tag: ${{ steps.release_tag.outputs.tag }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check release tag
        id: release_tag
        shell: bash
        run: |
          TAGS="$(git tag --points-at HEAD | sort -V)"
          if [ -z "$TAGS" ]; then
            echo "No tag points at HEAD; skipping Play Store deployment."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$(echo "$TAGS" | tail -n 1)"
          echo "Deploying tag $TAG to Google Play."
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-aab:
    if: needs.check_release_tag.outputs.tagged == 'true'
    needs:
      - check_release_tag
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # This is the project's own commit gate (`scripts/build.sh`'s `podman build`, here via
      # Docker instead): a successful image build already ran `gradle clean build`, the full
      # test suite, before any signed artifact is produced.
      - name: Build the verified image
        run: docker build -t fechtkarte-builder .

      # keystore.properties/release.keystore are gitignored and .dockerignore'd -- never part
      # of the image itself. Written to the checkout directly, then bind-mounted into a
      # container from the already-built (and already-tested) image for the signed build only.
      - name: Write release signing credentials
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_PASSWORD}" ] || [ -z "${RELEASE_KEY_PASSWORD}" ]; then
            echo "RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_PASSWORD are required for signed builds."
            exit 1
          fi

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=fechtkarte
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

      # Both outputs from one signed build -- the AAB for Play Store, the APK for the GitHub
      # release -- so `github-release` never has to re-run (and re-sign) anything build-aab
      # already did.
      - name: Build signed AAB and APK
        run: |
          docker run --rm -v "$PWD":/app -w /app fechtkarte-builder \
            ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Verify AAB signature
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "No AAB produced at $AAB"; exit 1; }
          # Fails the job (non-zero exit) if the signature doesn't verify against the keystore
          # just used to produce it -- the real check; nothing here is cosmetic.
          jarsigner -verify -verbose -certs "$AAB"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "No APK produced at $APK"; exit 1; }
          jarsigner -verify -verbose -certs "$APK"

      # F-Droid republishes this exact APK only if its own rebuild matches it byte for byte,
      # and a signing block AGP derives from the build environment rather than from the source
      # tree defeats that silently -- the build succeeds, the APK installs, and only F-Droid's
      # verification notices, after the tag is already public. Checked against the artifact
      # rather than against the setting that is supposed to prevent it.
      - name: Verify the APK carries no unreproducible signing block
        run: python3 scripts/check-apk-signing-block.py app/build/outputs/apk/release/app-release.apk

      - name: Clean up signing credentials
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: fechtkarte_aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fechtkarte_apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  deploy:
    if: needs.check_release_tag.outputs.tagged == 'true'
    needs:
      - check_release_tag
      - build-aab
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: fechtkarte_aab
          path: ${{ github.workspace }}/play-store

      # 'alpha' is the Play Developer API's own track id for closed testing (Play Console's UI
      # calls it "Closed testing", but the API/fastlane's Supply::Tracks still use the legacy
      # "alpha" name). Not 'internal': a new developer account can't reach production access at
      # all without first clearing the closed-testing prerequisite, and internal testing doesn't
      # count toward it -- confirmed the hard way, this project's v1.0.13 uploaded fine to
      # 'internal' but did nothing toward satisfying that requirement.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: 'at.j0s.meyercard.app'
          releaseFiles: ${{ github.workspace }}/play-store/app-release.aab
          tracks: 'alpha'
          releaseName: ${{ needs.check_release_tag.outputs.tag }}
          whatsNewDirectory: fastlane/metadata/android

  # r0adkll/upload-google-play above has no input for the store listing itself -- only the
  # binary, track, and "what's new" text. The listing (title/descriptions/screenshots/feature
  # graphic) needs real `fastlane supply`, which reads the exact same fastlane/metadata/android/
  # tree `deploy` already reads its changelog from -- one metadata source, two upload paths.
  #
  # Independent of `build-aab`/`deploy` on purpose: it needs no built artifact, only the tagged
  # commit's metadata, so it runs in parallel rather than waiting on the binary build. Like
  # `deploy`, `github-release` doesn't depend on it -- a listing-push failure (e.g. the service
  # account not yet having the Play Console "Store presence" permission) must not block the
  # GitHub release, same reasoning as `deploy` itself already documented above.
  deploy-listing:
    if: needs.check_release_tag.outputs.tagged == 'true'
    needs:
      - check_release_tag
    runs-on: ubuntu-24.04

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # No Gemfile/Fastfile: `fastlane supply` has always worked as a standalone CLI tool, and
      # this workflow needs nothing else from the fastlane toolchain -- a Fastfile would only
      # add a layer of indirection around a single command.
      - name: Install fastlane
        run: gem install fastlane --no-document

      # apk/aab/changelog uploads are `deploy`'s job, not this one's -- skipped here so the two
      # jobs' Play Console edits don't fight over the same release, and so a `deploy` failure
      # doesn't also block the listing text/images from going out.
      #
      # `--track alpha`, matching `deploy`'s own track (Play Console's "Closed testing", the
      # Developer API's legacy 'alpha' id -- see `deploy`'s own comment above): `supply` defaults
      # to `production` (Supply::Tracks::DEFAULT) and looks up that track's latest release to
      # resolve a version code even for a metadata-only push with changelogs skipped -- confirmed
      # the hard way, not guessed: the first real attempt at this job failed with "Could not find
      # release for version code ''" because it was checking a track with no release on it while
      # the app's real release sat on a different one. Update this if `deploy`'s own track ever
      # changes.
      - name: Push store listing (title, descriptions, images) to Google Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          fastlane supply \
            --package_name at.j0s.meyercard.app \
            --metadata_path fastlane/metadata/android \
            --track alpha \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true

  github-release:
    if: needs.check_release_tag.outputs.tagged == 'true'
    needs:
      - check_release_tag
      - build-aab
    runs-on: ubuntu-24.04
    permissions:
      # The only job in this workflow that writes anything -- build-aab and deploy stay at the
      # workflow-level `contents: read` default; this is the sole reason to escalate.
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: fechtkarte_apk
          path: release-apk

      # versionName/versionCode read straight from the build config that produced this exact
      # APK, not re-derived from the tag -- this project's tag (v1.0.2) and versionName (1.0.2)
      # have matched by convention so far, but nothing enforces that, and versionCode has no
      # fixed relationship to either. The changelog lookup below needs the real versionCode.
      - name: Determine version and locate this version's changelog
        id: version
        shell: bash
        run: |
          NAME="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          CODE="$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)"
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"

          # A release with no notes is a release nobody can act on -- fail loudly rather than
          # publish one silently blank, or silently fall back to some other text.
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::No changelog at $CHANGELOG for versionCode $CODE -- add one before tagging a release."
            exit 1
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: Rename APK to the release naming convention
        run: mv release-apk/app-release.apk "fechtkarte-${{ steps.version.outputs.name }}.apk"

      - name: Assemble release notes
        run: |
          cat "${{ steps.version.outputs.changelog }}" > release-notes.md
          echo "" >> release-notes.md
          cat .github/release-footer.md >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check_release_tag.outputs.tag }}" \
            "fechtkarte-${{ steps.version.outputs.name }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Fechtkarte ${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md
