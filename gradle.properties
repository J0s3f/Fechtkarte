# Project-wide Gradle settings
android.useAndroidX=true

# Jetifier rewrites old android.support.* references to androidx.* for
# dependencies that haven't migrated. This project has none -- every
# dependency here is already AndroidX-native (Room, DataStore, Compose,
# Navigation, Konsist, Roborazzi). Left enabled from the original scaffold
# with nothing to actually jetify, it sat harmless until T2.4: a transitive
# dependency (com.android.tools:common, then pulled in by Paparazzi) contains
# a string literal Jetifier can't safely rewrite and fails hard on
# (AmbiguousStringJetifierException), even though nothing in this project
# needs Jetifier to run at all. Disabled rather than special-cased around.
android.enableJetifier=false

# JVM heap for the Gradle process itself. The container image's 512 MiB default heap
# has been observed thrashing the GC to failure under AGP + Compose; this is not a
# generous number, just an adequate one for this project's current size.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m

# Kotlin
kotlin.code.style=official

# AGP 9.0 (T8.5, bumped for its R8/Kotlin-2.4-metadata support — see the agp
# comment in gradle/libs.versions.toml) turns on two behaviour changes by
# default: the "new DSL" and built-in Kotlin support. Both were bridged off
# here at first (`android.newDsl=false` / `android.builtInKotlin=false`) as
# a temporary compromise; T9.19 completed the real migration instead —
# dropping the explicit `org.jetbrains.kotlin.android` plugin (the actual
# source of the legacy-API warnings these flags were suppressing, confirmed
# via `-Pandroid.debug.obsoleteApi=true`) let both flags come out entirely,
# since neither Roborazzi's `android {}` usage nor anything else in this
# project turned out to depend on the old DSL surface.
